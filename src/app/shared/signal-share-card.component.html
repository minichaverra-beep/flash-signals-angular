@if (card) {
  <section class="share-panel" aria-label="Póster para compartir">
    <div
      class="poster-frame"
      title="Doble clic para ampliar"
      (dblclick)="expandPoster($event)"
      (click)="onPosterClick($event)"
    >
      @if (savedPosterUrl) {
        <img class="poster" [src]="savedPosterUrl" alt="Póster de la señal" (error)="onSavedPosterError()" />
      }
      <canvas
        #poster
        class="poster"
        [class.poster-buffer]="!!savedPosterUrl"
        role="img"
        aria-label="Póster de la señal"
      ></canvas>
    </div>

    <div class="share-actions">
      <button type="button" (click)="download()" [disabled]="busy">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M11 3h2v9.2l2.6-2.6 1.4 1.4L12 16.1 6.9 11l1.4-1.4L11 12.2V3zM5 18h14v2H5z"/>
        </svg>
        <span>Descargar</span>
      </button>
      <button
        #shareBtn
        type="button"
        (click)="openShare()"
        [disabled]="busy"
        [attr.aria-expanded]="shareOpen"
        aria-haspopup="dialog"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M18 16.1a2.9 2.9 0 0 0-2.2 1l-6.1-3.1a2.8 2.8 0 0 0 0-1.9l6-3.1A2.9 2.9 0 1 0 15 6a2.7 2.7 0 0 0 .1.7l-6 3.1a2.9 2.9 0 1 0 0 4.4l6.1 3.1a2.9 2.9 0 1 0 2.8-1.2z"/>
        </svg>
        <span>Compartir</span>
      </button>
    </div>
    @if (chartWarning) {
      <p class="note note-warn" role="status">Sin gráfico de velas en la tarjeta: {{ chartWarning }}</p>
    }
    @if (note) { <p class="note">{{ note }}</p> }

    @if (shareOpen) {
      <div class="share-overlay">
        <button type="button" class="backdrop" aria-label="Cerrar compartir" (click)="closeShare()"></button>
        <div
          #shareDialog
          class="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="share-dialog-title"
          tabindex="-1"
          (keydown)="onDialogKeydown($event)"
        >
          <header class="dialog-head">
            <h2 id="share-dialog-title">Compartir</h2>
            <button type="button" class="icon-btn" data-close aria-label="Cerrar" (click)="closeShare()">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/>
              </svg>
            </button>
          </header>
          <div class="net-list">
            <button type="button" (click)="shareWhatsApp()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10 10 0 0 0 4.65 1.14h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.87c-.24.68-1.4 1.3-1.94 1.38-.5.07-1.12.1-1.81-.11-.41-.13-.95-.31-1.63-.61-2.87-1.24-4.74-4.14-4.88-4.33-.14-.19-1.16-1.54-1.16-2.94s.73-2.08 1-2.37c.24-.27.64-.39 1.02-.39h.37c.12 0 .28-.04.44.34.16.39.56 1.36.61 1.46.05.1.08.22.02.35-.06.13-.1.22-.19.33-.1.12-.2.26-.29.35-.1.1-.2.2-.08.39.11.19.51.84 1.1 1.36.75.67 1.39.88 1.59.98.2.1.31.08.43-.05.12-.13.5-.58.63-.78.13-.2.27-.16.45-.1.18.07 1.16.55 1.36.65.2.1.33.15.38.23.05.08.05.48-.19 1.16z"/></svg>
              <span>WhatsApp</span>
            </button>
            <button type="button" (click)="shareTelegram()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M21.5 4.4 2.8 11.6c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 11.1-7c.5-.3 1-.1.6.3l-9 8.1-.4 4.7c.5 0 .7-.2 1-.5l2.3-2.2 4.9 3.6c.9.5 1.6.2 1.8-.8l3.3-15.2c.3-1.4-.5-2-1.5-1.6z"/></svg>
              <span>Telegram</span>
            </button>
            <button type="button" (click)="shareFacebook()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h2.6l.4-3H13v-2c0-.6.4-1 1-1z"/></svg>
              <span>Facebook</span>
            </button>
            <button type="button" (click)="shareInstagram()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 2A1.8 1.8 0 1 0 13.8 12 1.8 1.8 0 0 0 12 10.2zM17.2 6.9a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg>
              <span>Instagram</span>
            </button>
            <button type="button" (click)="shareMessenger()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.4 5.5 3.7 7.2V22l3.3-1.8c.9.2 1.9.4 3 .4 5.5 0 10-4.1 10-9.2S17.5 2 12 2zm1.1 12.3-2.6-2.7-4.9 2.7 5.4-5.7 2.5 2.7 4.8-2.7-5.2 5.7z"/></svg>
              <span>Messenger</span>
            </button>
            <button type="button" (click)="shareDiscord()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.3 5.2A17 17 0 0 0 15.1 4l-.4.8a15.6 15.6 0 0 1 3.9 1.4 16 16 0 0 0-13.2 0A12 12 0 0 1 9.3 4.8L8.9 4a17 17 0 0 0-4.2 1.2C2.1 8.6 1.4 12 1.6 15.4a17.2 17.2 0 0 0 5.3 2.7l.7-1.1a11 11 0 0 1-1.7-.8l.4-.3c3.3 1.5 6.8 1.5 10.1 0l.4.3c-.5.3-1.1.6-1.7.8l.7 1.1a17.2 17.2 0 0 0 5.3-2.7c.4-4-.6-7.4-2.8-10.2zM8.7 14c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2-.8 2-1.8 2zm6.5 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
              <span>Discord</span>
            </button>
            <button type="button" (click)="shareTwitter()" [disabled]="busy">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14.7 10.3 22 2h-2.2l-6.3 7.2L8.6 2H2l7.7 11.1L2 22h2.2l6.8-7.8L15.4 22H22l-7.3-11.7zm-2.4 2.8-.8-1.1L4.9 3.4h2.7l5.1 7.3.8 1.1 6.6 9.4h-2.7l-5.1-7.1z"/></svg>
              <span>Twitter</span>
            </button>
          </div>
        </div>
      </div>
    }
  </section>
}
