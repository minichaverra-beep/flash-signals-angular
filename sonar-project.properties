# SonarCloud — flash-signals-angular
# Create the project in SonarCloud UI first; match projectKey + organization.
# CI: .github/workflows/sonarcloud.yml (secret SONAR_TOKEN)

sonar.projectKey=minichaverra-beep_flash-signals-angular
sonar.projectName=Flash Signals Angular
sonar.organization=minichaverra-beep

sonar.sources=src,server
sonar.sourceEncoding=UTF-8

# Generated / deps
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/*.spec.ts

# CPD: templates and lockfiles inflate noise
sonar.cpd.exclusions=**/*.html,**/*.scss,**/package-lock.json

# JS (Express) + TS (Angular)
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.tsconfigPath=tsconfig.json
